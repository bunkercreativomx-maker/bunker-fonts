<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Bunker Fonts</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#131315;color:#ddd;font:15px system-ui,"Segoe UI",sans-serif;text-align:center}
button{margin:6px;background:#8b5cf6;color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}</style></head>
<body><div><h2>No me puedo conectar al servidor</h2>
<p>Tus fuentes activas siguen funcionando desde la copia local.</p>
<p id="e" style="color:#f87171"></p>
<button onclick="location.reload()">Reintentar</button></div>
<script>bunkerAgent.status().then(s=>{document.getElementById('e').textContent=(s.error||'')+' — '+s.server});
document.querySelector('button').onclick=()=>bunkerAgent.status().then(s=>location.href=s.server+'/')</script></body></html>
